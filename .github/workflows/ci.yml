name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: restaurant_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Initialiser la base de données de test
        run: mysql -h 127.0.0.1 -u root -p"$DB_PASSWORD" "$DB_NAME" < src/database/schema.sql
        env:
          DB_PASSWORD: ci_password
          DB_NAME: restaurant_ci

      - name: Lancer les tests
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci_password
          DB_NAME: restaurant_ci